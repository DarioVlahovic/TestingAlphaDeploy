name: Build and Push Docker Images

on:
  push:
    branches:
      - publish

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ApiService
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./TestingAlphaDeploy.ApiService/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/apiservice:latest

    - name: Build and push Web
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./TestingAlphaDeploy.Web/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/web:latest

    - name: Deploy to Portainer
      run: |
        curl -X PUT "${{ secrets.PORTAINER_ENDPOINT }}/api/stacks/${{ secrets.STACK_ID }}?endpointId=1" \
          -H "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"PullImage": true}'